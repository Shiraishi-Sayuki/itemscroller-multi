plugins {
	id 'net.fabricmc.fabric-loom'
	id 'maven-publish'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"
	implementation "org.jetbrains:annotations:24.1.0"

	implementation files("${rootProject.projectDir}/libs/${project.malilib_fabric_file}")
}

base {
	group = project.group + "." + project.mod_id
	archivesName = "itemscroller-common-${project.minecraft_version_out}"
	version = project.mod_version
}

loom {
	accessWidenerPath = file("src/main/resources/itemscroller.accesswidener")
}

processResources {
	exclude '**/*.xcf'
	exclude '**/xcf'
	inputs.property "mod_version", project.mod_version
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

jar {
	from(rootProject.file("LICENSE.txt")) {
		rename { "${it}_${base.archivesName}"}
	}
}

// Expose common sources and jar for loader modules (MultiLoader-Template pattern)
configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
	commonJar {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
	commonJar jar
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}
