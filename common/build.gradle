plugins {
	id 'dev.architectury.loom'
	id 'maven-publish'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.mappings_version}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"
	implementation "org.jetbrains:annotations:24.1.0"

	modImplementation files("${rootProject.projectDir}/libs/${project.malilib_fabric_file}")
}

base {
	group = project.group + "." + project.mod_id
	archivesName = "itemscroller-common-${project.minecraft_version_out}"
	version = project.mod_version
}

loom {
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName.set("itemscroller.refmap.json")
	}
}

processResources {
	exclude '**/*.xcf'
	exclude '**/xcf'
	inputs.property "mod_version", project.mod_version
}

java {
	withSourcesJar()
}

// Expose common sources for loader modules to compile directly (MultiLoader-Template pattern)
configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}
