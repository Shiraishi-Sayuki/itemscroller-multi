modLoader = "javafml"
loaderVersion = "[46,)"
license = "LGPLv3"

[[mods]]
modId = "itemscroller"
version = "${version}"
displayName = "Item Scroller"
displayURL = "https://github.com/maruohon/itemscroller"
logoFile = "assets/itemscroller/icon.png"
credits = "masa"
authors = "masa, Shiraishi-Sayuki (multiloader port)"
description = '''
Moves items in inventory screens by dragging, scrolling etc.
'''

[[mixins]]
config = "mixins.itemscroller.json"

[[dependencies.itemscroller]]
modId = "forge"
mandatory = true
versionRange = "[46,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.itemscroller]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20,1.21)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.itemscroller]]
modId = "malilib"
mandatory = true
versionRange = "[0.16,)"
ordering = "AFTER"
side = "CLIENT"
