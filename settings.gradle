pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = uri('https://maven.fabricmc.net')
		}
		maven {
			name = 'Architectury'
			url = uri('https://maven.architectury.dev/')
		}
		maven {
			name = 'Forge'
			url = uri('https://maven.minecraftforge.net')
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// This should match the folder name of the project, or else IDEA may complain
rootProject.name = 'itemscroller-multiloader'
include('common')
include('fabric')
include('forge')
